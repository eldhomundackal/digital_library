[tool.poetry]
name = "digital-library-api"
version = "1.0.0"
description = "Digital Library FastAPI Backend"
authors = ["Eldho <learningeldhodemo@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.32"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
alembic = "^1.14"
asyncpg = "^0.30"
pydantic = {extras = ["email"], version = "^2.10"}
pydantic-settings = "^2.7"
python-jose = {extras = ["cryptography"], version = "^3.3"}
passlib = {extras = ["bcrypt"], version = "^1.7"}
python-multipart = "^0.0.20"
boto3 = "^1.36"
celery = {extras = ["redis"], version = "^5.4"}
redis = "^5.2"
httpx = "^0.28"
aiosmtplib = "^3.0"
pillow = "^11.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
httpx = "^0.28"
factory-boy = "^3.3"
faker = "^33.0"
black = "^24.0"
pylint = "^3.3"
isort = "^5.13"
mypy = "^1.13"

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | alembic/versions
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["app"]
known_third_party = ["fastapi", "sqlalchemy", "pydantic", "celery", "redis", "boto3"]

[tool.pylint.main]
py-version = "3.12"
jobs = 0
recursive = true
fail-under = 8.0

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-instance-attributes",
    "import-outside-toplevel",
]

[tool.pylint.format]
max-line-length = 88

[tool.pylint.design]
max-args = 10
max-locals = 20
max-returns = 6
max-branches = 12

[tool.pylint.similarities]
min-similarity-lines = 10

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
